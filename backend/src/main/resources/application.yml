server:
  port: 8081

spring:
  application:
    name: knowledgegraph
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:knowledge_graph}?options=-c%20timezone=UTC
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    neo4j:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.project.knowledgegraph: DEBUG
